when:
  - event: [push, tag, manual, cron]

steps:
  - name: resolve-certbot-tag
    image: alpine:3.23
    environment:
      GHCR_IMAGE: ghcr.io/magicalwig34653/certbot-hetzner-cloud
      DOCKERHUB_REPO: certbot/certbot
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - apk add --no-cache curl jq skopeo
      - chmod +x scripts/resolve-certbot-tag.sh
      - scripts/resolve-certbot-tag.sh
      - cat certbot-tag.env
      - cat .tags
      - cat .build_args

  - name: docker-build-push
    image: woodpeckerci/plugin-docker-buildx:latest
    settings:
      registry: ghcr.io
      repo: ghcr.io/magicalwig34653/certbot-hetzner-cloud
      dockerfile: Dockerfile
      context: .
      platforms:
        - linux/amd64
      push: true
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags_file: .tags
      build_args_file: .build_args
    when:
      evaluate: 'CI_BUILD_EVENT != "pull_request"'
