when:
  - event: [push, tag, manual, cron]

steps:
  - name: resolve-build-push
    image: woodpeckerci/plugin-docker-buildx:latest
    environment:
      GHCR_IMAGE: ghcr.io/magicalwig34653/certbot-hetzner-cloud
      DOCKERHUB_REPO: certbot/certbot
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - apk add --no-cache curl jq coreutils
      - test -n "$GHCR_USERNAME" || { echo "GHCR_USERNAME is empty"; exit 1; }
      - test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is empty"; exit 1; }
      - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - |
        set -eu

        WORKDIR="$(mktemp -d)"
        TAGS_FILE="$WORKDIR/tags.txt"

        page=1
        while :; do
          url="https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags?page_size=100&page=${page}"
          response="$(curl -fsSL "$url")"

          echo "$response" | jq -r '.results[].name' >> "$TAGS_FILE"

          next="$(echo "$response" | jq -r '.next')"
          if [ "$next" = "null" ] || [ -z "$next" ]; then
            break
          fi

          page=$((page + 1))
        done

        CERTBOT_TAG="$(
          grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$TAGS_FILE" \
            | sort -V \
            | tail -n 1
        )"

        if [ -z "$CERTBOT_TAG" ]; then
          echo "Could not resolve latest stable Certbot tag" >&2
          exit 1
        fi

        echo "Resolved latest stable official Certbot tag: $CERTBOT_TAG"

        IMAGE_WITH_TAG="${GHCR_IMAGE}:${CERTBOT_TAG}"

        if docker manifest inspect "$IMAGE_WITH_TAG" >/dev/null 2>&1; then
          echo "Image already exists in GHCR, skipping build: $IMAGE_WITH_TAG"
          exit 0
        fi

        echo "Image does not exist yet in GHCR: $IMAGE_WITH_TAG"
        echo "Building and pushing..."

        docker buildx create --use --name certbot-builder || docker buildx use certbot-builder

        docker buildx build \
          --platform linux/amd64 \
          --build-arg CERTBOT_TAG="$CERTBOT_TAG" \
          --tag "$IMAGE_WITH_TAG" \
          --tag "${GHCR_IMAGE}:latest" \
          --push \
          .
