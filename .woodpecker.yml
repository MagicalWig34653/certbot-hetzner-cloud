when:
  - event: push
    branch: main
  - event: cron
  - event: manual

steps:
  resolve-certbot-tag:
    image: docker:29-cli
    environment:
      GHCR_IMAGE: ghcr.io/magicalwig34653/certbot-hetzner-cloud
      DOCKERHUB_REPO: certbot/certbot
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache curl jq coreutils
      - test -n "$GHCR_USERNAME" || { echo "GHCR_USERNAME is empty"; exit 1; }
      - test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is empty"; exit 1; }
      - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - chmod +x scripts/resolve-certbot-tag.sh
      - scripts/resolve-certbot-tag.sh
      - cat certbot-tag.env

  build-and-push:
    image: docker:29-cli
    environment:
      GHCR_IMAGE: ghcr.io/magicalwig34653/certbot-hetzner-cloud
      DOCKER_BUILDKIT: "1"
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache docker-cli-buildx
      - test -f certbot-tag.env || { echo "certbot-tag.env not found"; exit 1; }
      - . ./certbot-tag.env
      - echo "CERTBOT_TAG=$CERTBOT_TAG"
      - echo "IMAGE_EXISTS=$IMAGE_EXISTS"
      - |
        set -eu

        if [ "$IMAGE_EXISTS" = "true" ]; then
          echo "Image already exists, skipping build: ${GHCR_IMAGE}:${CERTBOT_TAG}"
          exit 0
        fi

        test -n "$GHCR_USERNAME" || { echo "GHCR_USERNAME is empty"; exit 1; }
        test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is empty"; exit 1; }

        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

        docker buildx create --use --name certbot-builder || docker buildx use certbot-builder

        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --build-arg CERTBOT_TAG="$CERTBOT_TAG" \
          --tag "${GHCR_IMAGE}:${CERTBOT_TAG}" \
          --tag "${GHCR_IMAGE}:latest" \
          --push \
          .
